<!-- 속성은 큰따옴표로! -->

<body>

  <div id="loginDiv" class="container">
    <!-- 로그인 전 -->
    <div id="signInDiv" class="whiteBlock container hidden">
      <p>로그인</p>
      <hr>

      <form>
        <input id="idTxt" class="signInput" type="text"
          onkeydown="javascript:if(event.keyCode == 13){signIn($('#idTxt').val(), $('#pwTxt').val());}"
          placeholder="아이디">
        <input id="pwTxt" class="signInput" type="password"
          onkeydown="javascript:if(event.keyCode == 13){signIn($('#idTxt').val(), $('#pwTxt').val());}"
          placeholder="비밀번호">
      </form>

      <button id="signInBtn" class="signBtn" onclick="signIn($('#idTxt').val(), $('#pwTxt').val())">로그인</button>
    </div>

    <!-- 로딩중 -->
    <div id="authLoadDiv" class="whiteBlock container">
      <hr>
      <p id="loadingP">LOADING</p>
      <p id="logP">jshsWiki v2.0.0</p>
      <hr>
    </div>

  </div>

  <!-- header -->
  <header class="container">

    <!-- 로고 이미지 -->
    <div style="width: 16rem;">
      <span id="logoImg" onclick="movePage('상상위키:대문', '', '', 'w')">상상위키</span>
      <!-- <span style="color: rgb(80, 0, 255);
        font-size: 2rem;
        position: relative;
        top: 1rem;
        width: 1.5rem;">beta</span> -->
    </div>
    <!-- <img id="logoImg" src="../src/img/icon.png" alt="logo" onclick="javascript:location.href='상상위키:대문'" /> -->

    <!-- 검색 관련 -->
    <div id="searchDiv" class="container">
      <input id="searchTxt" type="search" autocomplete="off" onkeydown="autoUpDown(event.keyCode)" />
      <button id="searchBtn">검색</button>
    </div>

  </header>

  <!-- navigation -->
  <nav class="container">

    <div id="navDiv" class="container">

      <!-- 최근 토론 버튼 -->
      <label for="debateInput" class="navBtn">토론</label>
      <input id="debateInput" class="hidden" type="button" onclick="movePage('all', '', '', 'debate');">

      <!-- 업로드 버튼 -->
      <label for="uploadInput" class="navBtn">업로드</label>
      <input id="uploadInput" class="hidden" type="button" onclick="movePage('', '', '', 'upload');">

      <!-- 랜덤문서 버튼 -->
      <label for="randomInput" class="navBtn" id="randomLabel">랜덤</label>
      <input id="randomInput" class="hidden" type="checkbox">

      <!-- 랜덤문서 관련 태그들 -->
      <div id="randomDiv" class="container"></div>

      <button id="errorBtn" style="font-size: 1.4rem; margin-left: 1rem;" onclick="reportError()">오류 제보</button>

    </div>

  </nav>

    <article id="searchArticle" class="whiteBlock container hidden"></article>

    <article id="debateArticle" class="whiteBlock container hidden"></article>

    <article id="uploadArticle" class="whiteBlock container hidden">
      <!-- 업로드 관련 태그들 -->

      <div id="newUploadDiv">

            <p id="fileNameP">파일을 선택해 주세요.</p>
            <label for="fileInput" class="commonBtn">파일 선택</label>
            <input id="fileInput" class="hidden" name="file" type="file" onchange="changeImage(this.files)">
          </div>
          <!-- 아래는 파일 이름 중복 체크용 -->
          <p id="checkFileP" class="hidden"></p>
        </div>

        <div><span>파일 설명: </span><textarea id="uploadContentTextarea"></textarea></div>
        <div class="container" style="justify-content: space-between; margin: .5rem 0;">
          <p>독점적 저작권이 존재하는 이미지를 업로드하거나, 저작권 또는 라이선스를 지키지 않거나 잘못 입력한 사용자는 법적 책임이 따를 수 있습니다.</p>
          <button class="commonBtn" onclick="checkImage()">업로드</button>
        </div>
      </div>
    </article>

    <article id="documentArticle" class="whiteBlock container">

      <!-- 문서 헤드 -->
      <div id="" class="headDiv container">

        <div class="titleDiv">
          <h1 class="titleH1">제목</h1>
          <p class="historyNumP">과연 몇번째?</p>
        </div>

        <div id="wikiToolDiv" class="container toolDiv">
          <button class="editBtn">편집</button>
          <button class="historyBtn">역사</button>
          <button class="linkBtn">역링크</button>
          <button class="debateBtn">토론</button>
          <button class="optionBtn">설정</button>
        </div>
      </div>
      <!-- 문서 내용 나오는 태그 -->
      <p id="documentW" class="" style="margin-block: 0;">문서를 불러오는 중입니다.</p>
    </article>

    <article id="editArticle" class="whiteBlock container hidden">

      <div id="" class="headDiv container">

        <div class="titleDiv">
          <h1 class="titleH1">제목</h1>
          <p class="historyNumP">과연 몇번째?</p>
        </div>
        <div id="editToolDiv" class="container toolDiv">
          <button class="exitBtn">취소</button>

          <button class="deleteBtn">삭제</button>

        </div>
      </div>

      <input type="text" id="commentInput" class="" placeholder="편집한 내용에 관한 코멘트"></input>
      <button id="previewBtn" class="commonBtn">미리보기</button>

      <!-- 미리보기 화면 -->
      <p class="preTxt"></p>
    </article>

    <article id="historyArticle" class="whiteBlock container hidden">

      <div id="" class="headDiv container">

        <div class="titleDiv">
          <h1 class="titleH1">제목</h1>
          <p class="historyNumP">(역사)</p>
        </div>

        <div id="historyToolDiv" class="container toolDiv">

      <!-- 역사 고르는 화면 (check)-->

      <!-- 역사 문서 비교 화면 (show)-->

        <table>
          <tr>
            <th class='historyTh'>

            <th class='historyTh'>

          </tr>

            <td class='historyTd'>

            </td>
          </tr>
          <tr>

            </th>
          </tr>
          <tr>
            <td class='historyTd' colspan="2">
              <div id="oldVsNewDiv"></div>
            </td>
          </tr>
        </table>
      </div>
      <!-- 문법 적용된 역사 보여주는 태그 -->
      <p id="showHistoryP" class="hidden"></p>
    </article>

    <!-- aside -->
    <aside class="container">
      <div>

        <!-- 로그인 후 -->
        <div id="authDiv" class="whiteBlock container hidden asideDiv">
          <p id="nickP">익명</p>
          <hr>

        <!-- 관련된 문서 -->

        <div id="rankDiv" class="whiteBlock container asideDiv">

          <p>기여도 순위</p>

      </div>



      <!-- 수정된 문서 -->

  <script>
    var userData;
    //페이지 첫 접속
    $('#logP').text('사용자 정보 확인중');
    firebase.auth().onAuthStateChanged(function (user) {

      //info 초기화
      userInfo = {};

      userData = user;

      movePoint = {
        type: '',
        doc: '',
        sharp: '',
        question: ''
      }

      console.log('로그인 중');

      if (user) {

        $('#logP').text('위키 기초 정보 수집중');
        firebase.database().ref('SERIAL').orderByKey().once('value', function (serialData) {

          docNote = [];
          serialList = [null];

          serialData.forEach(value => {
            //console.log(value.val());
            if (value.val().true != undefined) {
              serialNote[value.val().true] = Number(value.key);
              inv_serialNote[Number(value.key)] = value.val().true;
              docNote.push(value.val().true);

              serialList.push(value.val().true);
            } else {
              removeNote[value.val().false] = Number(value.key);

              serialList.push(value.val().false);
            }
          });


          $('#logP').text('사용자 정보 수집중');
          checkLevel().then(function () {
            console.log('로그인 됨');
            $('#logP').text('로그인 완료!');



            loadRank();
            startLogListener();
            getUrlAndMove();

            $("#signInDiv").addClass('hidden');
            $("#loginDiv").addClass('hidden');
            $('#authDiv').removeClass('hidden');
            $("#loginDiv").addClass('hidden');

            loading(false);
          });


        }).catch(err => {
          console.log(err);
        })

      } else {
        //로그아웃
        userInfo.level = 0;
        $('#authDiv').addClass('hidden');
        $("#signInDiv").removeClass('hidden');
        $("#loginDiv").removeClass('hidden');
        $('#authLoadDiv').addClass('hidden');
        console.log("계정 정보 없음");
      }
    });
    //페이지 불러오기 //btn == true이면 뒤로가기같은 버튼 이용한 것
    function getUrlAndMove(btn) {

      console.log('페이지가 변함');

      let url = decodeURI(location.pathname);
      let type = '';
      let hash = '';
      let question = '';

      if (location.pathname == '/' || location.pathname == '/w') {
        url = "상상위키:대문";
      } else {
        url = url.split(/\//);
        type = url[1];
        url = url.slice(2).join('/');
        console.log(url);
        hash = location.hash.substring(1);
        question = location.search.substring(1);

        if (question.split('&')[0] == 'doc=.') {
          question = question.split('&').slice(1).join('&');
          url = '.';
        }
      }

      if (type == '') {
        type = 'w';
      }

      movePage(url, hash, question, type, btn);
    }


    //뒤로가기 클릭 시
    // var isMouseIn = true;
    // window.addEventListener('mouseover', function () {
    //     isMouseIn = true;
    // });

    // window.addEventListener('mouseout', function () {
    //     isMouseIn = false;
    // });

    window.onpopstate = function (e) {
      getUrlAndMove(true);
    }

    //         alert('hi');

    //     };
    // })(window.history);

    //편집 중 나가는거 방지
    window.onbeforeunload = function () {
      if (movePoint.type == 'e') {
        if (reasonOfMove == '취소') {
          return null;
        } else if (reasonOfMove == '편집') {
          return null;
        } else if (reasonOfMove == '로그아웃') {
          return null;
        } else {

          //크롬은 표시 안됨
          return '편집을 중단하고 나가시겠습니까?\n변경한 내용은 저장되지 않습니다.';
        }
      } else {
        return null;
      }
    }
